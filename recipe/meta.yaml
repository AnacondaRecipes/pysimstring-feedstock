{% set name = "pysimstring" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ff5215f0b27f6c07041c1e8a1a0e795df3dc9e149a7ef0a1418ace65361d2322
  patches:
    # std::binary_function removed in C++17; libc++/Clang 20 errors without this
    - patches/0001-cdbpp-remove-binary_function-CXX17.patch

build:
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c')}}
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - pysimstring
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/percevalw/simstring
  dev_url: https://github.com/percevalw/simstring
  doc_url: https://github.com/percevalw/simstring
  summary: Python Simstring bindings for Linux, OS X and Windows
  description: Python Simstring bindings for Linux, OS X and Windows
  license: BSD-3-Clause
  license_family: BSD
  # LICENSE file is missing from sdist, but present in repo,
  # see also https://github.com/percevalw/pysimstring/blob/master/LICENSE
  license_file: '{{ environ["RECIPE_DIR"] }}/LICENSE'

extra:
  recipe-maintainers:
    - skupr-anaconda
